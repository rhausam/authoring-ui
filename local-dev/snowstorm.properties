# Local overrides for Snowstorm, loaded with
#   --spring.config.additional-location=file:local-dev/snowstorm.properties
# See local-dev/README.md.

# 8080 is commonly taken (e.g. Homebrew Apache)
server.port=8090

# Trust the X-AUTH-* headers added by local-dev/gateway.js so that branch
# userRoles (AUTHOR, ADMIN, ...) are calculated from permission records
ims-security.roles.enabled=true

# Large editions such as the Australian Edition exceed the default of 500000
elasticsearch.index.max.terms.count=1500000

# Shared ActiveMQ broker (also used by Authoring Services)
spring.activemq.broker-url=tcp://localhost:61616
spring.activemq.in-memory=false

# Drools validation rules used when the UI saves concepts (?validate=true).
# Clone https://github.com/IHTSDO/snomed-drools-rules here; the groups to run are
# chosen by the assertionGroupNames branch metadata (see seed.sh)
validation.drools.rules.path=${HOME}/git-repo/snomed-drools-rules
