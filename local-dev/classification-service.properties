# Local overrides for the Classification Service, loaded with
#   --spring.config.additional-location=file:local-dev/classification-service.properties
# start.sh runs it from local-dev/data/classification-service, so these paths are
# relative to that directory. See local-dev/README.md.

# Snowstorm's default classification-service.url points here
server.port=8089

# RF2 packages named by the previousPackage / dependencyPackage branch metadata
# (seed.sh symlinks the loaded release here)
snomed.release.storage.local.path=releases

classification.job.storage.local.path=jobs
module.storage.local.path=modules/
