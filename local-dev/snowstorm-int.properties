# A second Snowstorm for the International Edition, kept apart from the main (AU)
# Snowstorm in its own Elasticsearch indices ("int-" prefix). Used for reasoner
# comparisons; run it instead of the main Snowstorm (same port), with the Classification
# Service and ActiveMQ from start.sh. See "International Edition" in local-dev/README.md.

server.port=8090
elasticsearch.index.prefix=int-

# Called directly, not through the gateway
ims-security.roles.enabled=false

elasticsearch.index.max.terms.count=1500000

# Shared broker, but separate queue names from the main Snowstorm
spring.activemq.broker-url=tcp://localhost:61616
spring.activemq.in-memory=false
jms.queue.prefix=int

classification-service.url=http://localhost:8089/classification-service
classification-service.username=classification
classification-service.password=classification
classification-service.job.status.use-jms=true
classification-service.message.status.destination=int.classification-service.status
