# Local overrides for Authoring Services, loaded with
#   --spring.config.additional-location=file:local-dev/authoring-services.properties
# See local-dev/README.md.

server.port=8081

# MariaDB/MySQL database (password comes from local-dev/.secrets.env)
spring.datasource.url=jdbc:mysql://127.0.0.1:3306/ts_review?useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=local
spring.datasource.password=${TS_REVIEW_DB_PASSWORD}
# The default MySQL dialect writes CAST(... AS JSON), which MariaDB rejects.
# Comment this out if you use MySQL instead of MariaDB.
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MariaDBDialect

# Projects and tasks are stored in the database instead of Jira
jira.enabled=false

# Snowstorm and IMS are reached through the local gateway, which maps the
# forwarded login cookie back onto X-AUTH-* headers
snowstorm.url=http://localhost:9100/snowstorm/snomed-ct
ims.url=http://localhost:9100/ims

# UI state (open concepts, saved lists, ...) on the local filesystem
# relative to local-dev/data/authoring-services, where start.sh runs it
ui-state.storage.local.path=ui-states

# Values served to the UI from /authoring-services/ui-configuration
ui-configuration.endpoints.terminologyServerEndpoint=/snowstorm/snomed-ct/
ui-configuration.endpoints.imsEndpoint=/ims/
ui-configuration.endpoints.browserEndpoint=/

# Shared ActiveMQ broker (also used by Snowstorm for classification / branch events)
spring.activemq.broker-url=tcp://localhost:61616
