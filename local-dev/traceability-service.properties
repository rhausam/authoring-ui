# Local overrides for the Traceability Service, loaded with
#   --spring.config.additional-location=file:local-dev/traceability-service.properties
# See local-dev/README.md.
#
# It records the commits Snowstorm reports over JMS (authoring.traceability.enabled in
# snowstorm.properties). The UI uses it to list a task's changed concepts for review and
# promotion, the rebase status, and concept history. The gateway proxies
# /authoring-traceability-service/ here.

server.port=8085

# Shared ActiveMQ broker. Snowstorm sends to "<jms.queue.prefix>.traceability"
# ("default.traceability"); this service listens on "<platform.name>.traceability".
spring.activemq.broker-url=tcp://localhost:61616
platform.name=default

# Stored in the same Elasticsearch as Snowstorm, in indices prefixed "trace-"
elasticsearch.urls=http://localhost:9200
